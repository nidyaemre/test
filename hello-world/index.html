<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    :root {
      --bg: #f7f5f0;
      --fg: #1c1b19;
      --muted: #6b675f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161514;
        --fg: #f2efe8;
        --muted: #a29d93;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 10vw, 6rem);
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0.75rem 0 0;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello World</h1>
    <p>Ma première page HTML.</p>
  </main>
</body>
</html>
