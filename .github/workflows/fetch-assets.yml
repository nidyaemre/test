name: Fetch generated assets

on:
  push:
    branches: ["claude/**"]
    paths: ["tools/assets-manifest.txt", "tools/build-images.py", ".github/workflows/fetch-assets.yml"]
  workflow_dispatch:
    inputs:
      manifest:
        description: "Manifest file (one line per asset: <destination path> <source url>)"
        required: false
        default: tools/assets-manifest.txt
      build_images:
        description: "Run tools/build-images.py after downloading"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: fetch-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Download assets listed in the manifest
        run: bash tools/fetch-assets.sh "${{ github.event.inputs.manifest || 'tools/assets-manifest.txt' }}"
      - name: Unpack asset bundles (videos, fonts)
        run: |
          shopt -s nullglob
          for z in build/*.zip; do
            echo "unzip $z"
            unzip -o -q "$z" -d site/assets
          done
          # fonts.css lives in site/css; review material never ships with the site
          rm -f site/assets/fonts/fonts.css
          if [ -d site/assets/review ]; then mkdir -p build && rm -rf build/review && mv site/assets/review build/review; fi
          ls -laR site/assets | head -80
      - name: Build optimised images
        if: ${{ github.event.inputs.build_images != 'false' }}
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/build-images.py
      - name: Commit assets to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/assets
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "chore(assets): add generated media from manifest"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
